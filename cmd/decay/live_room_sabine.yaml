speaker:
  model: "omni"
  dimensions:
    x: 0.325
    y: 0.320
    z: 0.345
  offset:
    y: 0.1625
    z: 0.725
  directivity:
    horizontal:
      0: 0
    vertical:
      0: 0

decay:
  rfz_radius: 0.1
  shot_count: 30000
  shot_angle_range: 360
  order: 200
  gain_threshold_db: -50
  time_threshold_ms: 550
  t_range_ms: -30
  freq_corners: [65, 125, 250, 500, 1000, 2000, 4000, 8000]
  point_pairs:
    - name: "window_drums_OH_omni"
      source: { x: 3.0, y: 2.2, z: 1.1 }
      microphone:
        type: "omni"
        position: { x: 3.8, y: 2.2, z: 1.9 }
    - name: "window_drums_OH_back_cardioid" # The deadest
      source: { x: 3.0, y: 2.2, z: 1.1 }
      microphone:
        type: "cardioid"
        position: { x: 2.0, y: 2.2, z: 1.9 }
        normal: { x: 1.0, y: 0, z: -0.2 }
        back_db: -24
    - name: "window_drums_far_omni" # Deadest room position
      source: { x: 3.0, y: 2.2, z: 1.1 }
      microphone:
        type: "omni"
        position: { x: 0.8, y: 2.2, z: 1.3 }
    - name: "door_drums_OH_omni"
      source: { x: 1.5, y: 2.2, z: 1.1 }
      microphone:
        type: "omni"
        position: { x: 2.3, y: 2.2, z: 1.9 }
    - name: "door_drums_OH_cardioid" # Livest
      source: { x: 1.5, y: 2.2, z: 1.1 }
      microphone:
        type: "cardioid"
        position: { x: 2.3, y: 2.2, z: 1.9 }
        normal: { x: -1.0, y: 0, z: -0.2 }
        back_db: -24
    - name: "door_drums_room_omni" # Livest room position
      source: { x: 1.5, y: 2.2, z: 1.1 }
      microphone:
        type: "omni"
        position: { x: 3.5, y: 2.2, z: 1.3 }
    - name: "vox_center_to_window" # A safe live option
      source: { x: 2.5, y: 2.2, z: 1.8 }
      microphone:
        type: "cardioid"
        position: { x: 3.0, y: 2.2, z: 1.8 }
        normal: { x: -1.0, y: 0, z: 0.0 }
        back_db: -24
    - name: "vox_door_to_window" # Sometimes a really good live option
      source: { x: 1.0, y: 2.2, z: 1.8 }
      microphone:
        type: "cardioid"
        position: { x: 1.5, y: 2.2, z: 1.8 }
        normal: { x: -1.0, y: 0, z: 0.0 }
        back_db: -24
    - name: "vox_window_to_door" # The deadest
      source: { x: 3.5, y: 2.2, z: 1.8 }
      microphone:
        type: "cardioid"
        position: { x: 3.0, y: 2.2, z: 1.8 }
        normal: { x: 1.0, y: 0, z: 0.0 }
        back_db: -24
